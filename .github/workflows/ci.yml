# Runs on every push and pull request. Everything uses the Firebase emulators, so it needs no secrets and no
# Firebase project. Three jobs run side by side:
#   checks: formatting, lint, types, unit tests, production build
#   rules:  the Firestore security rules tests (tests/rules) against the emulator
#   e2e:    the browser tests (e2e/) against the emulators with the demo data
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npx prettier --check src e2e tests scripts
      - name: Lint
        run: npx oxlint . && npx eslint .
      - name: Types
        run: npm run type-check
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build-only
      - name: Email sender builds
        run: npm run build:email
      - name: Runtime dependencies have no known vulnerabilities
        run: npm audit --omit=dev

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Security rules tests
        run: npm run test:rules

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (emulators + demo data)
        run: >-
          npx firebase emulators:exec --only auth,firestore --project demo-switchback
          "npm run seed:demo && npx playwright test"
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
